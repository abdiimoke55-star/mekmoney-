<!DOCTYPE html>
<html lang="om">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mekmoney - Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Mekmoney Platform</h1>
    <p class="subtitle">Testing Page</p>

      <div class="input-group">
        <input type="email" id="email" placeholder="Email kee galchi...">
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="Password galchi...">

      <div class="btn-group">
        <button id="signup-btn" type="button">Sign Up</button>
        <button id="login-btn" type="button">Log In</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

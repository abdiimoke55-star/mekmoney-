<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task & Earn Platform</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin: 15px auto; max-width: 400px; }
        .btn { background: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>

    <h1>Kaffaltii Taskii Hojjechuu</h1>

    <div class="card">
        <h3>Madaallii Keessan (Balance)</h3>
        <h2 id="balance">0.00 ETB</h2>
    </div>

    <div class="card">
        <h3>Taskii Amma Jiru</h3>
        <p>Channel Telegram Subscribe Gochuu</p>
        <p><strong>Badhaasa: 2.00 ETB</strong></p>
        <button class="btn" onclick="completeTask()">Taskii Hojjedhu</button>
    </div>

    <script>
        let userBalance = 0.00;

        function completeTask() {
            userBalance += 2.00;
            document.getElementById('balance').innerText = userBalance.toFixed(2) + " ETB";
            alert("Galatoomaa! Taskii xumurtaniiltu. 2.00 ETB account keessanitti dabalameera.");
        }
    </script>
</body>
</html>
